services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: forno
      POSTGRES_DB: forno
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U forno -d forno']
      interval: 5s
      timeout: 5s
      retries: 15
  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgresql://forno:${POSTGRES_PASSWORD}@db:5432/forno
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'
  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://forno:${POSTGRES_PASSWORD}@db:5432/forno
      BAKER_PASSWORD: ${BAKER_PASSWORD:?Set BAKER_PASSWORD in .env}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      APP_ORIGIN: https://${DOMAIN:?Set DOMAIN in .env}
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - '3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
